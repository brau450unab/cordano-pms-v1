# Pipeline de Cloud Build para CORDANO PMS V1
# Proyecto GCP: gen-lang-client-0862587160 (349577440002)

steps:
  # 1. Construir la imagen del contenedor utilizando Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/cordano-services/cordano-pms-v1:$COMMIT_SHA'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/cordano-services/cordano-pms-v1:latest'
      - '.'

  # 2. Subir imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/cordano-services/cordano-pms-v1'

  # 3. Desplegar como servicio independiente en Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cordano-pms-v1'
      - '--image'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/cordano-services/cordano-pms-v1:$COMMIT_SHA'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=gen-lang-client-0862587160,GCP_REGION=us-west1,NODE_ENV=production'

images:
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/cordano-services/cordano-pms-v1:$COMMIT_SHA'
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/cordano-services/cordano-pms-v1:latest'

options:
  logging: CLOUD_LOGGING_ONLY
